# lefthook.yml
# Git hooks configuration for jsLPSolver

pre-commit:
    parallel: true
    commands:
        lint:
            glob: "*.{ts,tsx}"
            run: ESLINT_USE_FLAT_CONFIG=false npx eslint {staged_files}
        format:
            glob: "*.{ts,tsx,json,md,yml,yaml}"
            run: npx prettier --check {staged_files}

pre-push:
    parallel: false
    commands:
        typecheck:
            run: npx tsc --noEmit
        knip:
            run: npx knip
        deps:
            run: npx depcruise src --config .dependency-cruiser.cjs
        test:
            run: npm run test:coverage
